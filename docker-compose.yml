version: '3'

services:

  postgres-auth:
    image: postgres:latest
    ports:
      - "15432:5432"  
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD}
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data

  postgres-doc:
    image: postgres:latest
    ports:
      - "15433:5432" 
    environment:
      POSTGRES_DB: doc_service
      POSTGRES_USER: ITdiakon
      POSTGRES_PASSWORD: ${POSTGRES_DOC_PASSWORD}
    volumes:
      - postgres_doc_data:/var/lib/postgresql/data
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    ports:
      - "22181:2181"  # Изменили внешний порт на 22181
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: always

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181  # Внутренний порт остается 2181
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    restart: always

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001" #web
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server --console-address ":9001" /data #web
    restart: always

  gost-formatter-api:
    build: 
      context: ./gost-formatter
      dockerfile: Dockerfile
    ports:
      - "5000:5000"  # Map container port 5000 to host port 5000
    volumes:
      - ./gost-formatter/models:/app/models  # Mount models directory
      - ./gost-formatter/uploads:/app/uploads  # Mount uploads directory
      - ./gost-formatter/static:/app/static  # Mount static directory
    restart: always
    environment:
      - FLASK_APP=${FLASK_APP}
      - FLASK_ENV=${FLASK_ENV}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_API_URL=${LLM_API_URL}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME}

  gost-kafka-listener:
    build:
      context: ./gost-formatter
      dockerfile: Dockerfile.kafka-listener
    depends_on:
      - kafka
      - minio
      - gost-formatter-api
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - GOST_FORMATTER_API=http://gost-formatter-api:5000/api/format
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
    restart: always

  gost-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_GOST_API_URL=http://localhost:5000
    depends_on:
      - gost-formatter-api
    restart: always

volumes:
  postgres_auth_data:
  postgres_doc_data:
  minio_data: