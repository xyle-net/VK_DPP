version: '3'

services:

  postgres-auth:
    image: postgres:latest
    ports:
      - "15432:5432"  
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qweasdzxc
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data

  postgres-doc:
    image: postgres:latest
    ports:
      - "15433:5432" 
    environment:
      POSTGRES_DB: doc_service
      POSTGRES_USER: ITdiakon
      POSTGRES_PASSWORD: diakon-postgres
    volumes:
      - postgres_doc_data:/var/lib/postgresql/data
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    ports:
      - "22181:2181"  # Изменили внешний порт на 22181
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: always

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181  # Внутренний порт остается 2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    restart: always

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001" #web
    environment:
      MINIO_ROOT_USER: ITdiakon
      MINIO_ROOT_PASSWORD: diakon-minio
    volumes:
      - minio_data:/data
    command: server --console-address ":9001" /data #web
    restart: always

volumes:
  postgres_auth_data:
  postgres_doc_data:
  minio_data: